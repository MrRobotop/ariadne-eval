name: Bug report
description: Something is broken or behaves incorrectly.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before filing, please confirm the bug
        reproduces on the latest tagged alpha (`v0.0.7-alpha` or newer).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the bug.
      placeholder: "Runner.aevaluate crashes when a metric returns a non-finite score"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A copy-pasteable code snippet (under 30 lines) that reproduces the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full traceback if any.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ariadne-eval version
      placeholder: "v0.0.7-alpha (commit abc1234)"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.13"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
