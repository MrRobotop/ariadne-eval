name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (all extras)
        run: uv sync --all-extras --frozen

      - name: Ruff (lint)
        run: uv run ruff check src tests examples scripts

      - name: Ruff (format check)
        run: uv run ruff format --check src tests examples scripts

      - name: Mypy (strict)
        run: uv run mypy --strict src/ariadne_eval

      - name: Pytest (fast)
        env:
          OPENAI_API_KEY: sk-dummy-for-ci
          ANTHROPIC_API_KEY: sk-ant-dummy-for-ci
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: uv run pytest -m "fast and not integration" --cov=src/ariadne_eval --cov-report=term -q

      - name: Pytest (integration, VCR cassettes only — no network)
        env:
          OPENAI_API_KEY: sk-dummy-for-ci
          ANTHROPIC_API_KEY: sk-ant-dummy-for-ci
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: uv run pytest -m integration -q

      - name: Mkdocs (strict build)
        run: uv run mkdocs build --strict
