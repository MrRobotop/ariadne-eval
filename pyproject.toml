[project]
name = "ariadne-eval"
version = "0.0.8-alpha"
description = "Trajectory-level observability and evaluation for LLM agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Rishabh Patil", email = "rishabhashokpatil@gmail.com" },
]
keywords = [
    "llm",
    "llm-evaluation",
    "observability",
    "agents",
    "tracing",
    "opentelemetry",
    "ai-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "duckdb>=0.10",
    "pytz>=2024.1",  # required by duckdb-python for TIMESTAMPTZ round-trips
    "click>=8.1",
    "rich>=13.0",
    "anyio>=4.0",
    "python-ulid>=2.0",
    "litellm>=1.40",
    "scipy>=1.11",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/MrRobotop/ariadne-eval"
Documentation = "https://MrRobotop.github.io/ariadne-eval/"
Repository = "https://github.com/MrRobotop/ariadne-eval"
Issues = "https://github.com/MrRobotop/ariadne-eval/issues"
Changelog = "https://github.com/MrRobotop/ariadne-eval/blob/main/CHANGELOG.md"

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2",
]
# crewai is a known integration target; the adapter ships in a later phase.
# Pinning crewai now drags onnxruntime into the resolver, which has no
# macOS 26 / arm64 wheels at the time of writing. Left intentionally empty
# until ``adapters/crewai.py`` is implemented.
crewai = []
openai-assistants = [
    "openai>=1.30",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-recording>=0.13",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests",
    "types-pyyaml",
]
all = [
    "ariadne-eval[langgraph,openai-assistants,docs,dev]",
]

[project.scripts]
ariadne = "ariadne_eval.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ariadne_eval"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ariadne_eval",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "B",
    "UP",
    "S",
    "RUF",
    "SIM",
    "ANN",
    "D",
]
ignore = [
    "D203",
    "D213",
    "ANN401",
    # ANN101/ANN102 are deprecated and removed from modern ruff; older
    # pre-commit ruff versions still emit them. Ignoring keeps both happy.
    "ANN101",
    "ANN102",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "D"]
"benchmarks/**/*.py" = ["ANN", "S", "D"]
"scripts/**/*.py" = ["ANN", "S", "D"]
"examples/**/*.py" = ["ANN", "S", "D", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["ariadne_eval"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "duckdb.*",
    "scipy.*",
    "statsmodels.*",
    "ulid.*",
    "langgraph.*",
    "crewai.*",
    "pyvis.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "fast and not integration",
]
testpaths = ["tests"]
markers = [
    "fast: pure-Python, no network, <10s (default)",
    "integration: uses recorded HTTP cassettes",
    "slow: real benchmarks; manual trigger only",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["src/ariadne_eval"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
    # Protocol stub method bodies are just ``...`` and never executed.
    '^\s*\.\.\.\s*$',
]
show_missing = true
skip_covered = false
